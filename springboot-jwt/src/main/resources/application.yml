server:
  port: 8080

spring:
  application:
    name: authforge

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/authforge_db}
    username: ${DB_USERNAME:authforge_user}
    password: ${DB_PASSWORD:authforge_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:bharath's authforge-template}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}

  admin:
    name: ${ADMIN_NAME:AuthForge Admin}
    email: ${ADMIN_EMAIL:admin@authforge.com}
    password: ${ADMIN_PASSWORD:Admin@12345}